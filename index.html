<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18191E">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; connect-src https://sddobaofsrtlroetywbg.supabase.co; base-uri 'none'; form-action 'none'">
<title>Your workout · TYKO Fitness</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Your workout from TYKO Fitness">
<meta property="og:description" content="Tap to open it, log your sets as you go, and hit Finish when you're done.">
<meta property="og:image" content="https://tykofit.github.io/workout/og.png">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>

.tk-brand{--tk-h:38px;display:inline-flex;align-items:center;gap:10px;line-height:0}
.tk-brand img{display:block;width:auto}
.tk-brand .tk-mark{height:var(--tk-h)}
.tk-brand .tk-word{height:calc(var(--tk-h) * 1.06)}
.tk-brand .tk-ink{display:none}
@media print{
.tk-brand .tk-dark{display:none}
.tk-brand .tk-ink{display:block}
}

:root{--bg:#18191E;--card:#23252E;--card2:#282A34;--line:#33363F;--orange:#E07832;--orange2:#F08A42;
--text:#EDE8DE;--muted:#9BA3AE;--muted2:#727A85;--green:#4FBF7B;--coral:#E05B5B;--gold:#E0B052}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);padding:0 0 120px;
font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
line-height:1.5;font-size:15px}
.wf{max-width:560px;margin:0 auto;padding:18px 16px 0}
.wf *{box-sizing:border-box}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* hero */
.wf-h1{font-size:25px;font-weight:900;letter-spacing:-.02em;margin:12px 0 3px;line-height:1.15}
.wf-meta{color:var(--muted);font-size:13.5px}
.wf-coachnote{background:rgba(224,120,50,.10);border:1px solid rgba(224,120,50,.35);border-radius:12px;
padding:11px 13px;font-size:14px;margin-top:12px;color:#e8d9c8}
.wf-coachnote b{color:var(--orange2)}

/* static viewers: scripts never ran, so the file is a read-only sheet.
   The boot script adds .wf-live to <body>; everything below styles the
   page for the viewers that never get there (iPhone Messages preview). */
.wf-staticbox{background:rgba(224,176,82,.10);border:1px solid rgba(224,176,82,.4);border-radius:14px;
padding:12px 14px;font-size:13.5px;margin-top:14px;color:#e6d2a8;line-height:1.55}
.wf-staticbox b{color:var(--gold)}
.wf-staticbox code{display:block;background:var(--card);border:1px solid var(--line);border-radius:9px;
padding:8px 10px;margin-top:8px;color:var(--text);font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wf-replybtn{display:block;text-align:center;margin-top:10px;background:linear-gradient(90deg,var(--orange),var(--orange2));
border-radius:12px;color:#1a1207;font-weight:900;font-size:14.5px;padding:12px;text-decoration:none}
.wf-live .wf-staticbox{display:none}
body:not(.wf-live) .wf-in,body:not(.wf-live) .wf-check,body:not(.wf-live) .wf-add,body:not(.wf-live) .wf-del{opacity:.45;pointer-events:none}
body:not(.wf-live) .wf-sticky,body:not(.wf-live) .wf-finishwrap{display:none}

/* live mode, but the viewer cannot keep anything after it closes */
.wf-savewarn{display:none;background:rgba(224,91,91,.12);border:1px solid rgba(224,91,91,.45);border-radius:12px;
padding:10px 12px;font-size:13px;color:#f0bcbc;margin:10px 0 0}
.wf-savewarn.on{display:block}

/* the code as visible, selectable text: the fallback that always works */
.wf-codecap{color:var(--muted2);font-size:12px;margin:14px 0 6px}
.wf-codebox{user-select:all;-webkit-user-select:all;word-break:break-all;background:var(--card);
border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;color:var(--muted);
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:20px}

/* sticky progress */
.wf-sticky{position:sticky;top:0;z-index:20;background:rgba(24,25,30,.92);-webkit-backdrop-filter:blur(8px);
backdrop-filter:blur(8px);margin:14px -16px 6px;padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.wf-prog{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);
font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wf-prog b{color:var(--text);font-size:15px}
.wf-bar{height:5px;border-radius:99px;background:var(--card2);margin-top:7px;overflow:hidden}
.wf-bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--orange2));
transition:width .25s}

/* cards */
.wf-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted2);margin:20px 0 8px}
.wf-warm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14px;color:#c4ccd4}
.wf-warm ul{margin:4px 0 0;padding-left:18px}
.wf-warm li{margin-bottom:4px}
.wf-ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 14px 13px;margin:12px 0}
.wf-exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wf-chips{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.wf-chip{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;
padding:2.5px 7px;background:var(--card2);color:var(--muted)}
.wf-chip.grp{background:rgba(224,176,82,.15);color:var(--gold)}
.wf-exname{font-size:17.5px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.2}
.wf-rx{color:var(--orange2);font-weight:700;font-size:13.5px;margin-top:3px}
.wf-effort{color:var(--muted);font-size:12.5px;margin-top:2px}
.wf-video{flex-shrink:0;display:inline-block;background:var(--card2);border:1px solid var(--line);color:var(--text);
text-decoration:none;font-size:12.5px;font-weight:700;border-radius:10px;padding:8px 11px}
.wf-video:active{background:var(--line)}
.wf-super{background:rgba(224,176,82,.10);border:1px solid rgba(224,176,82,.35);color:#e6d2a8;border-radius:10px;
padding:8px 11px;font-size:13px;margin-top:10px}
.wf-slotnote{background:var(--card2);border-radius:10px;padding:8px 11px;font-size:13px;color:#c4ccd4;margin-top:10px}
.wf-target{background:rgba(79,191,123,.08);border:1px solid rgba(79,191,123,.3);border-radius:10px;
padding:9px 11px;font-size:13.5px;margin-top:10px;color:#cfe9da}
.wf-target b{color:var(--green)}
.wf-whybtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;
padding:0 0 0 6px;cursor:pointer}
.wf-why{display:none;color:var(--muted);font-size:12.5px;margin-top:6px}
.wf-why.open{display:block}
.wf-last{color:var(--muted);font-size:13px;margin-top:8px}
.wf-last b{color:var(--text);font-weight:700}
.wf-cues{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.wf-cue{font-size:12px;color:#c4ccd4;background:var(--card2);border-radius:8px;padding:4px 9px}

/* set rows */
.wf-sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.wf-cols{display:flex;gap:8px;align-items:center;font-size:10px;font-weight:800;color:var(--muted2);
letter-spacing:.08em;text-transform:uppercase;padding:0 2px}
.wf-cols .c1{width:44px}.wf-cols .c2,.wf-cols .c3{flex:1;text-align:center}.wf-cols .c4{width:52px;text-align:center}
.wf-cols .c5{width:46px}
.wf-row{display:flex;gap:8px;align-items:center;border-radius:12px;padding:2px}
.wf-row.is-done{background:rgba(79,191,123,.08)}
.wf-setno{width:44px;text-align:center;flex-shrink:0}
.wf-setno span{font-weight:800;font-size:14px;color:var(--muted)}
.wf-row.is-done .wf-setno span{color:var(--green)}
.wf-setno i{display:block;font-style:normal;font-size:10px;color:var(--muted2);line-height:1.2;margin-top:1px}
.wf-in{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--text);
font-size:16px;font-weight:700;text-align:center;padding:11px 4px;font-variant-numeric:tabular-nums}
.wf-in:focus{outline:none;border-color:var(--orange)}
.wf-in::placeholder{color:var(--muted2);font-weight:600;font-size:13px}
.wf-p{flex:none;width:52px}
.wf-check{width:46px;height:46px;flex-shrink:0;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);
color:var(--muted2);font-size:19px;font-weight:800;cursor:pointer;transition:transform .08s}
.wf-check:active{transform:scale(.92)}
.wf-row.is-done .wf-check{background:var(--green);border-color:var(--green);color:#0e2417}
.wf-del{width:28px;height:46px;flex-shrink:0;border:none;background:none;color:var(--muted2);font-size:15px;cursor:pointer}
.wf-prtag{font-size:10px;font-weight:900;letter-spacing:.05em;color:var(--gold);background:rgba(224,176,82,.15);
border-radius:6px;padding:2px 6px;margin-left:6px}
.wf-plate{color:var(--muted);font-size:12px;margin-top:8px;min-height:15px}
.wf-plate b{color:var(--text)}
.wf-add{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:11px;color:var(--muted);
font-size:13px;font-weight:700;padding:9px;width:100%;cursor:pointer}

/* finish */
.wf-finishwrap{margin:26px 0 8px}
.wf-finish{width:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border:none;border-radius:14px;
color:#1a1207;font-size:17px;font-weight:900;padding:16px;cursor:pointer;box-shadow:0 6px 24px rgba(224,120,50,.35)}
.wf-finish:active{transform:scale(.99)}
.wf-finishhint{color:var(--muted2);font-size:12px;text-align:center;margin-top:9px}
.wf-foot{color:var(--muted2);font-size:11.5px;text-align:center;margin:18px 0 8px}

/* rest pill */
.wf-rest{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;display:none;align-items:center;
gap:10px;background:#2b2313;border:1px solid rgba(224,176,82,.5);border-radius:99px;padding:9px 10px 9px 16px;
box-shadow:0 8px 30px rgba(0,0,0,.5)}
.wf-rest.on{display:flex}
.wf-rest b{font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:56px}
.wf-rest button{border:none;border-radius:99px;background:rgba(224,176,82,.15);color:var(--gold);font-size:12.5px;
font-weight:800;padding:7px 11px;cursor:pointer}
.wf-rest.go b{color:var(--green)}

/* summary overlay */
.wf-summary{position:fixed;inset:0;z-index:40;background:rgba(14,15,18,.97);display:none;overflow-y:auto;
-webkit-overflow-scrolling:touch}
.wf-summary.open{display:block}
.wf-sumin{max-width:560px;margin:0 auto;padding:26px 18px 60px}
.wf-summary *{box-sizing:border-box}
.wf-sumhead{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:16px}
.wf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wf-tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center}
.wf-tile b{display:block;font-size:19px;font-weight:900;color:var(--orange2);font-variant-numeric:tabular-nums}
.wf-tile span{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2)}
.wf-open{color:var(--gold);font-size:13px;margin:12px 0 0;min-height:0}
.wf-prlist{margin:14px 0 0}
.wf-prline{background:rgba(224,176,82,.10);border:1px solid rgba(224,176,82,.4);border-radius:11px;padding:9px 12px;
font-size:14px;margin-bottom:7px;color:#e6d2a8}
.wf-feel{margin-top:20px}
.wf-feel p{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.wf-feelrow{display:flex;gap:8px}
.wf-feelbtn{flex:1;font-size:22px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
padding:9px 0;cursor:pointer;filter:grayscale(60%);opacity:.75}
.wf-feelbtn.sel{border-color:var(--orange);background:rgba(224,120,50,.12);filter:none;opacity:1}
.wf-comment{width:100%;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
color:var(--text);font-size:15px;padding:12px;min-height:74px;font-family:inherit}
.wf-comment:focus{outline:none;border-color:var(--orange)}
.wf-send{display:block;box-sizing:border-box;width:100%;margin-top:16px;background:linear-gradient(90deg,var(--orange),var(--orange2));
border:none;border-radius:14px;color:#1a1207;font-size:16.5px;font-weight:900;padding:15px;cursor:pointer;
text-align:center;text-decoration:none}
.wf-copy{width:100%;margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;
color:var(--text);font-size:14.5px;font-weight:700;padding:13px;cursor:pointer}
.wf-sentnote{color:var(--green);font-size:13px;text-align:center;min-height:18px;margin:10px 0 0}
.wf-back{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-size:13.5px;
text-decoration:underline;cursor:pointer}
.wf-legend{color:var(--muted2);font-size:12px;margin:-2px 0 4px;line-height:1.45}
.wf-legend b{color:var(--muted);font-weight:700}

/* link page: the one-tap send, with the text and copy routes folded under it */
.wl-alt{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.wl-alt summary{color:var(--muted);font-size:13px;cursor:pointer;text-align:center;list-style:none}
.wl-alt summary::-webkit-details-marker{display:none}
.wl-alt[open] summary{margin-bottom:4px}
a.wf-copy{display:block;box-sizing:border-box;text-align:center;text-decoration:none}
.wf-send:disabled{opacity:.7}

/* confetti + pr pop */
.wf-cf{position:fixed;width:8px;height:8px;border-radius:2px;z-index:60;pointer-events:none;
animation:wffall .95s ease-in forwards}
@keyframes wffall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(120px) rotate(260deg)}}

@media print{
.wf-sticky,.wf-rest,.wf-summary,.wf-add,.wf-finishwrap,.wf-video,.wf-del,.wf-staticbox,.wf-savewarn{display:none!important}
body{background:#fff;color:#111}
.wf-ex,.wf-warm{background:#fff;border-color:#ccc}
.wf-exname,.wf-h1{color:#111}
.wf-in{background:#fff;border-color:#bbb;color:#111}
}

#wl-root{min-height:100vh}
.wl-load{max-width:560px;margin:0 auto;padding:18px 16px}
.wl-loadbar{height:5px;border-radius:99px;background:var(--card2);margin:30px 0 14px;overflow:hidden;position:relative}
.wl-loadbar i{position:absolute;left:-40%;top:0;bottom:0;width:40%;border-radius:99px;
background:linear-gradient(90deg,var(--orange),var(--orange2));animation:wlslide 1.1s ease-in-out infinite}
@keyframes wlslide{0%{left:-40%}100%{left:100%}}
.wl-loadtxt{color:var(--muted);font-size:14px;margin:0}
.wl-msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:18px}
.wl-msg .wf-h1{font-size:21px;margin:0 0 6px}
.wl-msg p{color:var(--muted);margin:0 0 4px}
.wl-banner{background:rgba(79,191,123,.10);border:1px solid rgba(79,191,123,.4);border-radius:12px;padding:10px 12px;
font-size:14px;margin-top:12px;color:#cfe9da}
.wl-banner.warn{background:rgba(224,176,82,.10);border-color:rgba(224,176,82,.4);color:#e6d2a8}
.wl-banner.bad{background:rgba(224,91,91,.12);border-color:rgba(224,91,91,.45);color:#f0bcbc}
.wl-sync.ok{color:var(--green)}
.wl-sync.warn{color:var(--gold)}
.wl-sync.bad{color:var(--coral)}
.wl-noscript{max-width:560px;margin:0 auto;padding:18px 16px;color:var(--muted)}
</style>
</head>

  var proto = String((window.location && window.location.protocol) || '');
  var atRisk = !CFG.cloud && (!storageOk || (proto !== 'http:' && proto !== 'https:' && proto !== 'file:'));
  function showSaveWarn() {
    var el = doc.getElementById('wf-savewarn');
    if (el) el.classList.add('on');
  }
  if (atRisk) showSaveWarn();

  function load() {
    if (!storageOk) return null;
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return o && o.v === 1 ? o : null;
    } catch (e) { return null; }
  }
  function save() {
    // The time of the last change, so the link page can tell which copy is
    // newer when this phone and the cloud disagree.
    store.t = Date.now();
    if (CFG.onSave) { try { CFG.onSave(store); } catch (e) {} }
    if (!storageOk) return;
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { storageOk = false; if (!CFG.cloud) { atRisk = true; showSaveWarn(); } }
  }

  var exEls = [].slice.call(doc.querySelectorAll('.wf-ex'));
  var restEl = doc.getElementById('wf-rest');
  var restTimeEl = doc.getElementById('wf-resttime');
  var sumEl = doc.getElementById('wf-summary');
  var actx = null;
  var bestNow = [];   // rolling per-exercise best e1RM this session (seeded from history)
  var prHits = {};    // exIdx -> best PR e1RM hit live this session

  exEls.forEach(function (ex, i) {
    var b = parseFloat(ex.getAttribute('data-beste1'));
    bestNow[i] = isFinite(b) ? b : null;
  });

  /* ---------------- rows ---------------- */
  function rowsOf(ex) { return [].slice.call(ex.querySelectorAll('.wf-row')); }
  function val(row, sel) { var el = row.querySelector(sel); return el ? el.value : ''; }
  function num(row, sel) {
    var v = parseFloat(String(val(row, sel)).replace(',', '.'));
    return isFinite(v) && v > 0 ? v : null;
  }
  function rowState(row) {
    return { w: val(row, '.wf-w'), r: val(row, '.wf-r'), s: val(row, '.wf-s'), p: val(row, '.wf-p'),
             done: row.classList.contains('is-done'),
             // The suggestion this row started life with, carried across reloads.
             // Recomputing it on restore is not possible: rows are added before
             // values are replayed, so addRow would read a neighbour that still
             // holds its server prefill and stamp a suggestion nobody made.
             pre: row.getAttribute('data-pre') };
  }
  function persist() {
    exEls.forEach(function (ex, i) { store.ex[String(i)] = { rows: rowsOf(ex).map(rowState) }; });
    // On the link page a change after sending means the coach holds an older
    // log, so the Send button has to offer itself again.
    if (CFG.cloud) store.sent = false;
    save();
  }

  function addRow(ex) {
    var setsBox = ex.querySelector('.wf-sets');
    var rows = rowsOf(ex);
    var k = rows.length;
    var timed = ex.getAttribute('data-timed') === '1';
    var row = doc.createElement('div');
    row.className = 'wf-row';
    var mid = timed
      ? '<input class="wf-in wf-s" type="text" inputmode="numeric" placeholder="sec" aria-label="Seconds">'
      : '<input class="wf-in wf-r" type="text" inputmode="numeric" placeholder="reps" aria-label="Reps">';
    row.innerHTML =
      '<div class="wf-setno"><span>' + (k + 1) + '</span></div>' +
      '<input class="wf-in wf-w" type="text" inputmode="decimal" placeholder="lb" aria-label="Weight in pounds">' +
      mid +
      '<input class="wf-in wf-p" type="text" inputmode="numeric" placeholder="RIR" aria-label="Reps left in the tank">' +
      '<button class="wf-check" type="button" aria-label="Mark set done">&#10003;</button>' +
      '<button class="wf-del" type="button" aria-label="Remove this set">&#10005;</button>';
    // carry the previous row's weight forward, the common case mid-exercise
    var prevW = rows.length ? val(rows[rows.length - 1], '.wf-w') : '';
    setsBox.appendChild(row);
    var wIn = row.querySelector('.wf-w');
    if (wIn && prevW) wIn.value = prevW;
    stampPrefill(row); // carried-forward weight is a suggestion too, not a logged set
    return row;
  }

  /* ---------------- restore ---------------- */
  // Snapshot what we suggested BEFORE anything overwrites it.
  exEls.forEach(function (ex) { rowsOf(ex).forEach(stampPrefill); });

  exEls.forEach(function (ex, i) {
    var saved = store.ex && store.ex[String(i)];
    if (!saved || !saved.rows) return;
    while (rowsOf(ex).length < saved.rows.length) addRow(ex);
    var rows = rowsOf(ex);
    saved.rows.forEach(function (rs, k) {
      var row = rows[k];
      if (!row) return;
      // An empty SAVED value means the client deliberately cleared that box, so
      // it must be replayed as empty. Skipping it left the server-rendered
      // prefill sitting there, and a re-ticked row then reported the coach's
      // suggested weight as a lift that happened. rowState() only ever writes
      // strings, so null/undefined is the real "nothing saved".
      var set = function (sel, v) { var el = row.querySelector(sel); if (el && v != null) el.value = v; };
      set('.wf-w', rs.w); set('.wf-r', rs.r); set('.wf-s', rs.s); set('.wf-p', rs.p);
      // Restore the ORIGINAL suggestion last, over whatever addRow guessed.
      if (rs.pre != null) row.setAttribute('data-pre', rs.pre);
      if (rs.done) row.classList.add('is-done');
    });
    updatePlate(ex);
  });

  // A reload used to forget every PR tag, and the summary then named only the
  // PRs ticked since. Replay the restored ticks in order, quietly.
  exEls.forEach(function (ex, i) {
    rowsOf(ex).forEach(function (r) { if (r.classList.contains('is-done')) checkPR(i, r, true); });
  });

  /* ---------------- progress ---------------- */
  function progress() {
    var total = 0, done = 0;
    exEls.forEach(function (ex) {
      rowsOf(ex).forEach(function (r) { total++; if (r.classList.contains('is-done')) done++; });
    });
    var c = doc.getElementById('wf-count');
    var t = doc.getElementById('wf-total');
    var f = doc.getElementById('wf-barfill');
    if (c) c.textContent = String(done);
    if (t) t.textContent = String(total);
    if (f) f.style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
    return { total: total, done: done };
  }

  /* ---------------- rest timer ---------------- */
  var rest = { until: 0, timer: null, going: false };
  function startRest(sec) {
    if (!sec || sec <= 0) return;
    rest.until = Date.now() + sec * 1000;
    rest.going = false;
    restEl.classList.remove('go');
    restEl.classList.add('on');
    if (!rest.timer) rest.timer = setInterval(tickRest, 250);
    tickRest();
  }
  function stopRest() {
    restEl.classList.remove('on');
    restEl.classList.remove('go');
    if (rest.timer) { clearInterval(rest.timer); rest.timer = null; }
  }
  function tickRest() {
    var remain = rest.until - Date.now();
    if (remain <= 0) {
      if (!rest.going) {
        rest.going = true;
        restTimeEl.textContent = 'GO';
        restEl.classList.add('go');
        beep();
        if (navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch (e) {} }
        setTimeout(stopRest, 1800);
      }
      return;
    }
    var s = Math.ceil(remain / 1000);
    restTimeEl.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep() {
    try {
      if (!actx) return;
      var t0 = actx.currentTime;
      [0, 0.22].forEach(function (off) {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.frequency.value = 880;
        o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, t0 + off);
        g.gain.exponentialRampToValueAtTime(0.2, t0 + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
        o.start(t0 + off); o.stop(t0 + off + 0.18);
      });
    } catch (e) {}
  }

  /* ---------------- PRs ---------------- */
  function e1(w, r) { return r === 1 ? w : w * (1 + r / 30); }
  // quiet = replaying a restored row: put its PR tag and summary line back,
  // without a confetti parade for a set they lifted an hour ago.
  function checkPR(exIdx, row, quiet) {
    var base = bestNow[exIdx];
    if (base == null) return; // first-ever session = baseline, not a PR parade
    var w = num(row, '.wf-w'), r = num(row, '.wf-r');
    if (!w || !r || r > 30) return;
    var v = e1(w, r);
    if (v > base + 0.01) {
      bestNow[exIdx] = v;
      prHits[exIdx] = Math.round(v);
      if (!row.querySelector('.wf-prtag')) {
        var tag = doc.createElement('span');
        tag.className = 'wf-prtag';
        tag.textContent = 'PR!';
        var setno = row.querySelector('.wf-setno span');
        if (setno) setno.appendChild(tag);
      }
      if (!quiet) confetti(row);
    }
  }
  function confetti(row) {
    var rect = row.getBoundingClientRect();
    var colors = ['#E07832', '#E0B052', '#4FBF7B', '#EDE8DE'];
    for (var i = 0; i < 20; i++) {
      var p = doc.createElement('i');
      p.className = 'wf-cf';
      p.style.background = colors[i % colors.length];
      p.style.left = (rect.left + rect.width * (0.55 + Math.random() * 0.4)) + 'px';
      p.style.top = (rect.top + rect.height / 2 + (Math.random() * 16 - 8)) + 'px';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.animationDuration = (0.7 + Math.random() * 0.5) + 's';
      doc.body.appendChild(p);
      setTimeout((function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; })(p), 1400);
    }
  }

  /* ---------------- plate hint ---------------- */
  function updatePlate(ex) {
    var hint = ex.querySelector('.wf-plate');
    if (!hint) return;
    var rows = rowsOf(ex);
    var w = null;
    for (var i = rows.length - 1; i >= 0; i--) { var v = num(rows[i], '.wf-w'); if (v) { w = v; break; } }
    var focused = doc.activeElement && doc.activeElement.classList && doc.activeElement.classList.contains('wf-w')
      ? parseFloat(doc.activeElement.value) : NaN;
    if (isFinite(focused) && focused > 0 && ex.contains(doc.activeElement)) w = focused;
    if (!w || w < 45) { hint.textContent = ''; return; }
    if (Math.abs(w - 45) < 0.01) { hint.innerHTML = '<b>45 lb</b> = just the bar'; return; }
    var per = (w - 45) / 2;
    var plates = [45, 35, 25, 10, 5, 2.5];
    var out = [], rem = per;
    for (var j = 0; j < plates.length; j++) {
      while (rem >= plates[j] - 0.01) { out.push(plates[j]); rem -= plates[j]; }
    }
    var txt = out.join(' + ');
    if (rem > 0.26) txt += ' (+' + (Math.round(rem * 10) / 10) + ')';
    hint.innerHTML = '<b>' + w + ' lb</b> = bar + ' + (txt || '0') + ' each side';
  }

  /* ---------------- started clock ---------------- */
  function markStarted() { if (!store.started) { store.started = Date.now(); save(); } }

  /* ---------------- events (delegated, added rows need no wiring) ---------------- */
  doc.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    if (t.classList.contains('wf-in')) {
      markStarted();
      persist();
      var ex = closestEx(t);
      if (ex && t.classList.contains('wf-w')) updatePlate(ex);
    }
    if (t.id === 'wf-comment') { store.note = t.value; unsend(); save(); refreshShare(); }
  });

  function closestEx(el) { while (el && el !== doc && (!el.classList || !el.classList.contains('wf-ex'))) el = el.parentNode; return el === doc ? null : el; }
  function closest(el, cls) { while (el && el !== doc && (!el.classList || !el.classList.contains(cls))) el = el.parentNode; return el === doc ? null : el; }

  doc.addEventListener('click', function (e) {
    var t = e.target;
    if (!t) return;

    var check = closest(t, 'wf-check');
    if (check) {
      ensureAudio();
      var row = closest(check, 'wf-row');
      var ex = closestEx(row);
      var exIdx = exEls.indexOf(ex);
      var turningOn = !row.classList.contains('is-done');
      row.classList.toggle('is-done');
      markStarted();
      if (turningOn) {
        var restSec = parseInt(ex.getAttribute('data-rest'), 10);
        if (isFinite(restSec)) startRest(restSec);
        checkPR(exIdx, row);
      }
      persist();
      progress();
      return;
    }

    var del = closest(t, 'wf-del');
    if (del) {
      var drow = closest(del, 'wf-row');
      var dex = closestEx(drow);
      if (drow && drow.parentNode) drow.parentNode.removeChild(drow);
      if (dex) renumber(dex);
      persist();
      progress();
      return;
    }

    if (closest(t, 'wf-add')) {
      var aex = closestEx(t);
      if (aex) { addRow(aex); persist(); progress(); }
      return;
    }

    if (closest(t, 'wf-whybtn')) {
      var wex = closestEx(t);
      var why = wex ? wex.querySelector('.wf-why') : null;
      if (why) why.classList.toggle('open');
      return;
    }

    if (t.id === 'wf-rest15') { rest.until += 15000; tickRest(); return; }
    if (t.id === 'wf-restskip') { stopRest(); return; }

    if (t.id === 'wf-finish') { finish(); return; }
    if (t.id === 'wf-backbtn') { sumEl.classList.remove('open'); return; }
    if (t.id === 'wf-sms') { sendTapped(); return; } // the anchor's own href does the navigating
    if (t.id === 'wf-copy') { copyLog(); return; }
    if (t.id === 'wf-cloudsend') { cloudSend(t); return; }

    var feel = closest(t, 'wf-feelbtn');
    if (feel) {
      store.feel = parseInt(feel.getAttribute('data-f'), 10);
      unsend();
      save();
      [].slice.call(doc.querySelectorAll('.wf-feelbtn')).forEach(function (b) {
        b.classList.toggle('sel', b === feel);
      });
      refreshShare();
      return;
    }
  });

  function renumber(ex) {
    rowsOf(ex).forEach(function (r, k) {
      var s = r.querySelector('.wf-setno span');
      if (s) {
        var tag = s.querySelector('.wf-prtag');
        s.textContent = String(k + 1);
        if (tag) s.appendChild(tag);
      }
    });
  }

  /* ---------------- finish + encode ---------------- */

  /* Every row ships PREFILLED with today's target, which is the whole point of
     the file, and it is also a trap: a row nobody touched still holds numbers.
     Counting those turned "I did 5 sets" into "14 sets, 3,250 lb" and wrote
     sets that never happened into the client's history. A row therefore counts
     only when the client ticked it or changed it away from what we suggested.
     The prefill is captured at boot, before any restore can overwrite it. */
  function rowFingerprint(row) {
    return [val(row, '.wf-w'), val(row, '.wf-r'), val(row, '.wf-s'), val(row, '.wf-p')].join('|');
  }
  function stampPrefill(row) { row.setAttribute('data-pre', rowFingerprint(row)); }

  function isTouched(r) {
    if (r.classList.contains('is-done')) return true;
    var pre = r.getAttribute('data-pre');
    if (pre == null) return !!(num(r, '.wf-w') || num(r, '.wf-r') || num(r, '.wf-s'));
    return rowFingerprint(r) !== pre;
  }
  function countedRows(ex) { return rowsOf(ex).filter(isTouched); }
  // The box asks for reps in reserve, because that is how every program here
  // writes effort ("stop about 3 reps short of failure"). The log and the
  // lifting history keep RPE, so it converts here: RIR 0 (nothing left) is
  // RPE 10. num() treats 0 as empty, which is exactly the RIR worth keeping,
  // so this reads the box itself. Past 9 in reserve is not a work set.
  function rpeFromRir(row) {
    var raw = String(val(row, '.wf-p')).replace(',', '.').trim();
    if (raw === '') return null;
    var rir = parseFloat(raw);
    if (!isFinite(rir) || rir < 0 || rir > 9) return null;
    return Math.round((10 - rir) * 2) / 2;
  }
  function collect() {
    var x = [];
    exEls.forEach(function (ex) {
      var name = ex.getAttribute('data-name');
      var sets = countedRows(ex).map(function (r) {
        return [num(r, '.wf-w'), num(r, '.wf-r'), num(r, '.wf-s'), rpeFromRir(r)];
      });
      if (sets.length) x.push({ n: name, s: sets });
    });
    return x;
  }
  function stats() {
    var x = collect();
    var sets = 0, vol = 0;
    x.forEach(function (e) {
      e.s.forEach(function (s) { sets++; if (s[0] && s[1]) vol += s[0] * s[1]; });
    });
    return { x: x, sets: sets, vol: Math.round(vol) };
  }
  function durationMin() {
    if (!store.started || !store.finished) return null;
    var m = Math.round((store.finished - store.started) / 60000);
    return m >= 1 && m <= 600 ? m : null;
  }
  function prLines() {
    var lines = [];
    exEls.forEach(function (ex, i) {
      if (prHits[i]) lines.push(ex.getAttribute('data-name') + ', new best, ' + prHits[i] + ' lb estimated max');
    });
    return lines;
  }

  function finish() {
    // Never gate Finish on confirm(). Some in-app viewers suppress dialogs
    // entirely, and there the button simply did nothing, which is the exact
    // complaint this whole file exists to answer. The unticked count is shown
    // in the summary instead, where it can be read and acted on.
    store.finished = Date.now();
    if (!store.started) store.started = store.finished;
    persist();
    renderSummary();
    sumEl.classList.add('open');
    try { sumEl.scrollTop = 0; } catch (e) {}
  }

  /* What is genuinely absent from the log, which is NOT the same as what is
     unticked: a row the client typed real numbers into counts as performed
     even without the tick. Counting unticked rows here told people to go back
     for sets the tiles had already counted, two contradictory numbers one line
     apart. */
  function missingCount() {
    var n = 0;
    exEls.forEach(function (ex) {
      rowsOf(ex).forEach(function (r) { if (!isTouched(r)) n++; });
    });
    return n;
  }

  function renderSummary() {
    var s = stats();
    var m = durationMin();
    var tiles = doc.getElementById('wf-tiles');
    tiles.innerHTML =
      '<div class="wf-tile"><b>' + s.sets + '</b><span>sets</span></div>' +
      '<div class="wf-tile"><b>' + s.vol.toLocaleString() + '</b><span>lb moved</span></div>' +
      '<div class="wf-tile"><b>' + (m == null ? '-' : m) + '</b><span>minutes</span></div>';
    var prs = prLines();
    var prBox = doc.getElementById('wf-prs');
    prBox.innerHTML = prs.length
      ? '<div class="wf-prlist">' + prs.map(function (l) { return '<div class="wf-prline">🏆 ' + escapeHtml(l) + '</div>'; }).join('') + '</div>'
      : '';
    // renderSummary owns this line, so a summary reopened after a reload says
    // the same thing the one at Finish said.
    var openEl = doc.getElementById('wf-open');
    if (openEl) {
      var miss = missingCount();
      openEl.textContent = miss > 0
        ? miss + (miss === 1 ? ' set has' : ' sets have') + " nothing written in them, so they are not in this log. Go back if you did them."
        : '';
    }
    var cm = doc.getElementById('wf-comment');
    if (cm) cm.value = store.note || '';
    sendLabel();
    [].slice.call(doc.querySelectorAll('.wf-feelbtn')).forEach(function (b) {
      b.classList.toggle('sel', parseInt(b.getAttribute('data-f'), 10) === store.feel);
    });
    refreshShare();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function b64url(s) {
    var b = btoa(unescape(encodeURIComponent(s)));
    return b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function buildMessage() {
    var s = stats();
    var m = durationMin();
    var payload = { v: 1, a: CFG.id, d: Date.now(), m: m, f: store.feel, c: store.note || null, x: s.x };
    var miss = missingCount();
    if (miss > 0) payload.p = miss;
    var code = 'TYKO1.' + b64url(JSON.stringify(payload));
    var lines = [CFG.title + ', done ✅'];
    var meat = s.sets + (s.sets === 1 ? ' set' : ' sets');
    if (s.vol > 0) meat += ' · ' + s.vol.toLocaleString() + ' lb moved';
    if (m != null) meat += ' · ' + m + ' min';
    lines.push(meat);
    prLines().forEach(function (l) { lines.push('🏆 PR: ' + l); });
    if (store.feel) lines.push('Felt ' + store.feel + '/5');
    if (store.note) lines.push('“' + store.note + '”');
    lines.push('');
    lines.push(code);
    return { msg: lines.join('\n'), code: code };
  }

  // The send button is a real link. A tapped href escapes to the Messages
  // composer in viewers that block script-driven navigation, which is exactly
  // where a location.href assignment used to die silently.
  function refreshShare() {
    var built = buildMessage();
    var a = doc.getElementById('wf-sms');
    if (a) a.setAttribute('href', 'sms:' + (CFG.phone || '') + '?&body=' + encodeURIComponent(built.msg));
    var box = doc.getElementById('wf-code');
    if (box) box.textContent = built.code;
    return built;
  }
  function sendTapped() {
    store.sent = true; save();
    note("Messages should be open with your log ready, just hit send. If nothing opened, press and hold the code below, copy it, and text it to me.");
  }
  function copyLog() {
    var built = refreshShare();
    var ok = function () { store.sent = true; save(); note('Copied. Paste it into a text to your coach and send it.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(built.msg).then(ok, function () { legacyCopy(built.msg, ok); });
    } else legacyCopy(built.msg, ok);
  }
  function legacyCopy(msg, ok) {
    try {
      var ta = doc.createElement('textarea');
      ta.value = msg;
      doc.body.appendChild(ta);
      ta.select();
      doc.execCommand('copy');
      doc.body.removeChild(ta);
      ok();
    } catch (e) { note('Could not copy here. Press and hold the code below, copy it, and text it to me.'); }
  }
  function note(t) { var el = doc.getElementById('wf-sentnote'); if (el) el.textContent = t; }

  // The link page's one-tap send: the same TYKO1 code the text would carry,
  // posted straight to the coach's desk by CFG.onSend. The text and copy
  // routes stay underneath it for the day the network says no.
  var sending = false;
  function sendLabel() {
    var cs = doc.getElementById('wf-cloudsend');
    if (cs && !sending) cs.textContent = store.sent ? '✓ Sent' : cs.getAttribute('data-label');
  }
  // A new feel or comment after sending is news the coach does not have yet.
  function unsend() { if (CFG.cloud && store.sent) { store.sent = false; sendLabel(); } }
  function cloudSend(btn) {
    if (sending || !CFG.onSend) return;
    sending = true;
    var built = refreshShare();
    btn.disabled = true;
    btn.textContent = 'Sending…';
    note('');
    CFG.onSend(built.code, store, function (ok, msg) {
      sending = false;
      btn.disabled = false;
      btn.textContent = ok ? '✓ Sent' : btn.getAttribute('data-label');
      // cloudSent tells a reopened page this log went to the desk rather than
